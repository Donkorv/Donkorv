<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="100%" stop-color="#141B24"/>
    </linearGradient>
    <linearGradient id="trend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E9C7F"/>
      <stop offset="100%" stop-color="#D4A24C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint ledger grid, left two-thirds only -->
  <g stroke="#2A3442" stroke-width="1">
    <line x1="0" y1="60" x2="760" y2="60"/>
    <line x1="0" y1="120" x2="760" y2="120"/>
    <line x1="0" y1="180" x2="760" y2="180"/>
    <line x1="0" y1="240" x2="760" y2="240"/>
  </g>

  <!-- eyebrow label -->
  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#6B7A8F">AUDIT-TRAINED · ANALYTICS-BOUND</text>

  <!-- name -->
  <text x="70" y="132" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#F3F1EA">VANESSA DONKOR</text>

  <!-- tagline -->
  <text x="70" y="168" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#B9C2CC">Data Analyst in training — 8+ years turning compliance data into decisions</text>

  <!-- stack row -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8FA3AE">
    <rect x="70" y="200" width="8" height="8" fill="#3E9C7F"/>
    <text x="86" y="208">SQL</text>

    <rect x="150" y="200" width="8" height="8" fill="#3E9C7F"/>
    <text x="166" y="208">PYTHON</text>

    <rect x="260" y="200" width="8" height="8" fill="#3E9C7F"/>
    <text x="276" y="208">TABLEAU</text>

    <rect x="368" y="200" width="8" height="8" fill="#3E9C7F"/>
    <text x="384" y="208">EXCEL</text>
  </g>

  <!-- signature: tally marks becoming a trend line -->
  <g>
    <!-- ledger tally strokes fading in from the left, four-and-a-slash groups -->
    <g stroke="#4A5A6A" stroke-width="4" stroke-linecap="round" opacity="0.55">
      <line x1="840" y1="235" x2="840" y2="205"/>
      <line x1="856" y1="235" x2="856" y2="205"/>
      <line x1="872" y1="235" x2="872" y2="205"/>
      <line x1="888" y1="235" x2="888" y2="205"/>
      <line x1="834" y1="207" x2="894" y2="233"/>
    </g>
    <g stroke="#5E7A73" stroke-width="4" stroke-linecap="round" opacity="0.75">
      <line x1="920" y1="230" x2="920" y2="185"/>
      <line x1="936" y1="230" x2="936" y2="185"/>
      <line x1="952" y1="230" x2="952" y2="185"/>
      <line x1="968" y1="230" x2="968" y2="185"/>
      <line x1="914" y1="187" x2="974" y2="228"/>
    </g>

    <!-- the tally rhythm resolves into a clean ascending trend line -->
    <polyline points="1000,215 1035,175 1070,145 1105,110 1140,75"
      fill="none" stroke="url(#trend)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1000" cy="215" r="5" fill="#3E9C7F"/>
    <circle cx="1035" cy="175" r="5" fill="#5EAF8C"/>
    <circle cx="1070" cy="145" r="5" fill="#8CB587"/>
    <circle cx="1105" cy="110" r="5" fill="#C0AA6C"/>
    <circle cx="1140" cy="75" r="6" fill="#D4A24C"/>
  </g>

  <text x="1000" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#6B7A8F">TICKS BECOME TRENDS</text>
</svg>
